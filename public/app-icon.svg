<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <!--
    CalmTouch 앱 아이콘 (2026-09-11 두 번째 판) — 손끝이 닿은 자리에서 퍼지는 물결.
    가족 공통의 게이지 호는 뺐다(사용자 결정). 타일 색만 가족과 같다.
    고리 셋은 안쪽이 굵고 바깥이 가늘어져 "퍼지며 잔잔해지는" 순서를 읽게 하고, 트인 자리를 서로 다르게 돌려
    표적(target)이 아니라 물결로 보이게 했다. 닿은 점만 가족의 골드.
    → my-obsidian-vault / 10-Projects/CalmTouch.md
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1" gradientTransform="rotate(15)">
      <stop offset="0" stop-color="#134450"/>
      <stop offset="1" stop-color="#071c22"/>
    </linearGradient>
  </defs>

  <rect width="192" height="192" rx="44" fill="url(#tile)"/>

  <g fill="none" stroke="#eef7f8" stroke-linecap="round">
    <!-- 바깥 고리: r 58, 둘레 364.4 — 3/4 만 -->
    <circle cx="96" cy="96" r="58" stroke-width="4" stroke-opacity="0.55"
            stroke-dasharray="272 92.4" transform="rotate(-62 96 96)"/>
    <!-- 가운데 고리: r 38, 둘레 238.8 -->
    <circle cx="96" cy="96" r="38" stroke-width="6" stroke-opacity="0.8"
            stroke-dasharray="188 50.8" transform="rotate(118 96 96)"/>
    <!-- 안쪽 고리: r 20, 둘레 125.7 -->
    <circle cx="96" cy="96" r="20" stroke-width="8"
            stroke-dasharray="100 25.7" transform="rotate(-8 96 96)"/>
  </g>
  <!-- 닿은 점 — 골드 -->
  <circle cx="96" cy="96" r="6.5" fill="#e8d18a"/>
</svg>
